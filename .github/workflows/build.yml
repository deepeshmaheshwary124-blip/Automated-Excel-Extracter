name: Build Windows .exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    working-directory: universal_ai_doc_extractor

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          choco install tesseract -y --no-progress
        shell: powershell

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller ^
            --name "Universal AI Document Extractor" ^
            --onefile ^
            --windowed ^
            --noconfirm ^
            --clean ^
            --hidden-import "PySide6.QtCore" ^
            --hidden-import "PySide6.QtWidgets" ^
            --hidden-import "PySide6.QtGui" ^
            --hidden-import "pytesseract" ^
            --hidden-import "easyocr" ^
            --hidden-import "openpyxl" ^
            --hidden-import "pandas" ^
            --hidden-import "PIL" ^
            --hidden-import "PIL.Image" ^
            --hidden-import "cryptography" ^
            --hidden-import "cryptography.fernet" ^
            --hidden-import "pypdf2" ^
            --hidden-import "pypdfium2" ^
            --hidden-import "matplotlib" ^
            --hidden-import "matplotlib.backends.backend_qtagg" ^
            --hidden-import "requests" ^
            --hidden-import "pydantic" ^
            --collect-all "PySide6" ^
            main.py
        shell: cmd

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
        shell: cmd
        continue-on-error: true

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-AI-Document-Extractor
          path: universal_ai_doc_extractor/dist/Universal AI Document Extractor.exe
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: universal_ai_doc_extractor/dist/Universal AI Document Extractor.exe
          generate_release_notes: true
