name: Build Windows .exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    working-directory: universal_ai_doc_extractor

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── System deps ───────────────────────────────────────────────────────
      - name: Install Tesseract OCR
        run: choco install tesseract -y --no-progress
        shell: powershell

      - name: Install UPX (executable compression)
        run: choco install upx -y --no-progress
        shell: powershell

      # ── Python deps ───────────────────────────────────────────────────────
      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: cmd

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build .exe with PyInstaller (spec file)
        run: |
          pyinstaller ^
            --noconfirm ^
            --clean ^
            --upx-dir "C:\ProgramData\chocolatey\bin" ^
            universal_ai_doc_extractor.spec
        shell: cmd

      # ── Verify ───────────────────────────────────────────────────────────
      - name: Verify .exe was created
        run: |
          dir "dist\"
          if not exist "dist\Universal AI Document Extractor.exe" (
            echo "ERROR: .exe not found in dist/"
            exit /b 1
          )
          echo "Build successful."
        shell: cmd

      # ── Tests (non-blocking) ──────────────────────────────────────────────
      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short
        shell: cmd
        continue-on-error: true

      # ── Artifacts ────────────────────────────────────────────────────────
      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-AI-Document-Extractor
          path: universal_ai_doc_extractor/dist/Universal AI Document Extractor.exe
          if-no-files-found: error
          retention-days: 30

      # ── Release (tag pushes only) ─────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: universal_ai_doc_extractor/dist/Universal AI Document Extractor.exe
          generate_release_notes: true
