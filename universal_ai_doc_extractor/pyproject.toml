[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "universal-ai-doc-extractor"
version = "2.0.0"
description = "Universal AI Document Extractor & Excel Automation Assistant"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "openpyxl>=3.1.2",
    "pandas>=2.1.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
    "pypdf2>=3.0.0",
    "pypdfium2>=4.0.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.8.0",
    "python-Levenshtein>=0.23.0",
    "pydantic>=2.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
